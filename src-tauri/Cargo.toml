[package]
name = "highround"
version = "0.1.0"
description = "HighRound — CoD Zombies guides"
authors = ["Zenato"]
license = "MIT"
repository = "https://github.com/Zenatoo/highround"
edition = "2024"
rust-version = "1.90"

[lib]
name = "highround_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
